<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="todoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f2b" />
      <stop offset="50%" stop-color="#091540" />
      <stop offset="100%" stop-color="#141c48" />
    </linearGradient>

    <linearGradient id="phoneFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3d7c" />
      <stop offset="100%" stop-color="#0c1638" />
    </linearGradient>

    <linearGradient id="cardPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0175C2" />
      <stop offset="100%" stop-color="#54C5F8" />
    </linearGradient>

    <linearGradient id="taskCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#54C5F8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#091540" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" rx="24" fill="url(#todoBg)" />

  <!-- Ambient Glow Behind Phone -->
  <ellipse cx="750" cy="400" rx="380" ry="340" fill="url(#phoneGlow)" />

  <!-- LEFT PANEL: Project Info & Flutter Highlights -->
  <g transform="translate(100, 160)">
    <!-- Tag Pill -->
    <rect width="160" height="34" rx="17" fill="rgba(84, 197, 248, 0.15)" stroke="#54C5F8" stroke-width="1.5" />
    <text x="80" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#54C5F8" text-anchor="middle" letter-spacing="1.5">FLUTTER APP</text>

    <!-- Project Title -->
    <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">Todo App</text>
    
    <!-- Subtitle -->
    <text x="0" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#B4C6E7">
      Task Management &amp; Daily Organizer
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#8FA0C7" width="380">
      <tspan x="0" dy="0">Built with Flutter &amp; clean architectural patterns.</tspan>
      <tspan x="0" dy="26">Features local persistence, responsive animations,</tspan>
      <tspan x="0" dy="26">task categorization, and intuitive daily tracking.</tspan>
    </text>

    <!-- Tech Badges Container -->
    <g transform="translate(0, 290)">
      <!-- Badge 1: Flutter -->
      <rect x="0" y="0" width="105" height="38" rx="10" fill="#0d1b46" stroke="#0175C2" stroke-width="1.5" />
      <text x="52" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#54C5F8" text-anchor="middle">Flutter 3</text>

      <!-- Badge 2: Dart -->
      <rect x="115" y="0" width="85" height="38" rx="10" fill="#0d1b46" stroke="#0175C2" stroke-width="1.5" />
      <text x="157" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#54C5F8" text-anchor="middle">Dart</text>

      <!-- Badge 3: SQLite -->
      <rect x="210" y="0" width="120" height="38" rx="10" fill="#0d1b46" stroke="#0175C2" stroke-width="1.5" />
      <text x="270" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#54C5F8" text-anchor="middle">Local Storage</text>

      <!-- Badge 4: Clean UI -->
      <rect x="0" y="50" width="125" height="38" rx="10" fill="#0d1b46" stroke="#0175C2" stroke-width="1.5" />
      <text x="62" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#54C5F8" text-anchor="middle">Responsive UI</text>

      <!-- Badge 5: State Mgmt -->
      <rect x="135" y="50" width="155" height="38" rx="10" fill="#0d1b46" stroke="#0175C2" stroke-width="1.5" />
      <text x="212" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#54C5F8" text-anchor="middle">State Management</text>
    </g>

    <!-- Quick Stats -->
    <g transform="translate(0, 420)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#54C5F8">60 FPS</text>
      <text x="0" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8FA0C7">Fluid Experience</text>

      <text x="120" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#54C5F8">100%</text>
      <text x="120" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8FA0C7">Clean Code</text>

      <text x="230" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#54C5F8">Offline</text>
      <text x="230" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8FA0C7">First Architecture</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Realistic Mobile Phone Mockup -->
  <g transform="translate(680, 80)" filter="url(#shadow)">
    <!-- Outer Phone Bezel -->
    <rect width="360" height="640" rx="44" fill="#09132d" stroke="url(#phoneFrameGrad)" stroke-width="5" />

    <!-- Screen Glass -->
    <rect x="14" y="14" width="332" height="612" rx="34" fill="#060c1e" />

    <!-- Notch / Dynamic Island -->
    <rect x="110" y="24" width="140" height="24" rx="12" fill="#000000" />
    <circle cx="215" cy="36" r="4.5" fill="#142145" />

    <!-- App Bar -->
    <g transform="translate(36, 68)">
      <text x="0" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8FA0C7">Tuesday, March 26</text>
      <text x="0" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">My Daily Tasks</text>
      <!-- User avatar circle -->
      <circle cx="270" cy="30" r="18" fill="#0175C2" />
      <text x="270" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AH</text>
    </g>

    <!-- Progress Banner Card -->
    <g transform="translate(36, 140)">
      <rect width="288" height="90" rx="18" fill="url(#cardPrimaryGrad)" />
      <text x="20" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#091540">PROGRESS TODAY</text>
      <text x="20" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#091540">4 of 5 Completed</text>
      <text x="20" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#091540" opacity="0.8">Keep up the great work!</text>
      
      <!-- Circular Progress Indicator -->
      <circle cx="240" cy="45" r="26" fill="none" stroke="rgba(9, 21, 64, 0.25)" stroke-width="6" />
      <circle cx="240" cy="45" r="26" fill="none" stroke="#091540" stroke-width="6" stroke-dasharray="163" stroke-dashoffset="35" stroke-linecap="round" />
      <text x="240" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#091540" text-anchor="middle">80%</text>
    </g>

    <!-- Task Items List -->
    <!-- Task 1 (Completed) -->
    <g transform="translate(36, 250)">
      <rect width="288" height="68" rx="14" fill="url(#taskCardGrad)" stroke="rgba(84, 197, 248, 0.2)" stroke-width="1" />
      <!-- Checked box -->
      <circle cx="26" cy="34" r="12" fill="#00D26A" />
      <path d="M 21 34 L 25 38 L 32 29" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#8FA0C7" text-decoration="line-through">Design Flutter UI System</text>
      <text x="48" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#54C5F8">Completed • 09:30 AM</text>
    </g>

    <!-- Task 2 (Completed) -->
    <g transform="translate(36, 330)">
      <rect width="288" height="68" rx="14" fill="url(#taskCardGrad)" stroke="rgba(84, 197, 248, 0.2)" stroke-width="1" />
      <circle cx="26" cy="34" r="12" fill="#00D26A" />
      <path d="M 21 34 L 25 38 L 32 29" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#8FA0C7" text-decoration="line-through">Setup Clean State Management</text>
      <text x="48" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#54C5F8">Completed • 11:15 AM</text>
    </g>

    <!-- Task 3 (In Progress / Active) -->
    <g transform="translate(36, 410)">
      <rect width="288" height="74" rx="14" fill="rgba(84, 197, 248, 0.12)" stroke="#54C5F8" stroke-width="1.5" />
      <circle cx="26" cy="37" r="12" fill="none" stroke="#54C5F8" stroke-width="2.5" />
      <text x="48" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Optimize Animation FPS</text>
      <text x="48" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#FFA500">In Progress • Priority High</text>
    </g>

    <!-- Task 4 (Upcoming) -->
    <g transform="translate(36, 496)">
      <rect width="288" height="64" rx="14" fill="url(#taskCardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="26" cy="32" r="12" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
      <text x="48" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#DCE7FA">Deploy Android Release APK</text>
      <text x="48" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8FA0C7">Due Today • 05:00 PM</text>
    </g>

    <!-- Floating Action Button (FAB) -->
    <g transform="translate(250, 540)">
      <circle cx="30" cy="30" r="26" fill="url(#cardPrimaryGrad)" filter="url(#shadow)" />
      <line x1="30" y1="20" x2="30" y2="40" stroke="#091540" stroke-width="3.5" stroke-linecap="round" />
      <line x1="20" y1="30" x2="40" y2="30" stroke="#091540" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
