<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091540" />
      <stop offset="50%" stop-color="#0f235b" />
      <stop offset="100%" stop-color="#050c26" />
    </linearGradient>

    <!-- Flutter Primary Gradient -->
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54C5F8" />
      <stop offset="50%" stop-color="#0175C2" />
      <stop offset="100%" stop-color="#02569B" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <radialGradient id="glowPulse" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#54C5F8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#02569B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#091540" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" rx="32" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="350" r="280" fill="url(#glowPulse)" />

  <!-- Decorative Tech Grid & Orbit Rings -->
  <circle cx="400" cy="360" r="300" fill="none" stroke="rgba(84, 197, 248, 0.15)" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="400" cy="360" r="240" fill="none" stroke="rgba(1, 117, 194, 0.25)" stroke-width="1.5" />
  <circle cx="400" cy="360" r="180" fill="none" stroke="rgba(84, 197, 248, 0.2)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Floating Code Symbols -->
  <g opacity="0.3" font-family="'Fira Code', monospace" font-size="22" font-weight="bold" fill="#54C5F8">
    <text x="90" y="180">&lt;Widget /&gt;</text>
    <text x="610" y="220">Future&lt;void&gt;</text>
    <text x="80" y="580">setState()</text>
    <text x="630" y="560">MaterialApp</text>
  </g>

  <!-- Developer Silhouette / Illustration -->
  <g transform="translate(0, 20)">
    <!-- Shoulders / Torso -->
    <path d="M 240 680 C 240 520, 320 480, 400 480 C 480 480, 560 520, 560 680 Z" fill="#0d1b46" stroke="rgba(84, 197, 248, 0.3)" stroke-width="2" />
    
    <!-- Tech Hoodie Collar & Zippers -->
    <path d="M 330 495 L 400 580 L 470 495" fill="none" stroke="#0175C2" stroke-width="4" stroke-linecap="round" />
    <line x1="400" y1="580" x2="400" y2="680" stroke="#54C5F8" stroke-width="3" stroke-linecap="round" />

    <!-- Head / Neck -->
    <path d="M 370 430 L 370 485 L 430 485 L 430 430 Z" fill="#14285b" />
    <!-- Face Base -->
    <ellipse cx="400" cy="350" rx="95" ry="115" fill="#1a3575" stroke="#0175C2" stroke-width="2" />
    
    <!-- Modern Tech Hair -->
    <path d="M 305 340 C 300 240, 350 200, 410 200 C 470 200, 500 230, 495 330 C 470 280, 450 270, 400 270 C 350 270, 320 300, 305 340 Z" fill="#091540" />

    <!-- Modern Smart Glasses / AR Glasses -->
    <rect x="330" y="325" width="55" height="35" rx="10" fill="rgba(84, 197, 248, 0.2)" stroke="#54C5F8" stroke-width="3" />
    <rect x="415" y="325" width="55" height="35" rx="10" fill="rgba(84, 197, 248, 0.2)" stroke="#54C5F8" stroke-width="3" />
    <line x1="385" y1="342" x2="415" y2="342" stroke="#54C5F8" stroke-width="3" stroke-linecap="round" />
    <line x1="305" y1="340" x2="330" y2="340" stroke="#54C5F8" stroke-width="3" stroke-linecap="round" />
    <line x1="470" y1="340" x2="495" y2="340" stroke="#54C5F8" stroke-width="3" stroke-linecap="round" />

    <!-- Confident Smile -->
    <path d="M 375 405 Q 400 422 425 405" fill="none" stroke="#54C5F8" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Official Flutter Icon Badge Floating on Right -->
  <g transform="translate(560, 300)" filter="url(#neonGlow)">
    <circle cx="50" cy="50" r="45" fill="#091540" stroke="#54C5F8" stroke-width="2.5" />
    <!-- Flutter stylized wings -->
    <path d="M 52 24 L 28 48 L 44 64 L 78 30 Z" fill="#54C5F8" />
    <path d="M 52 56 L 36 72 L 52 88 L 78 62 Z" fill="#0175C2" />
    <path d="M 44 64 L 60 48 L 76 64 L 60 80 Z" fill="#02569B" opacity="0.6" />
  </g>

  <!-- Floating Android Robot Badge Floating on Left -->
  <g transform="translate(100, 300)" filter="url(#neonGlow)">
    <circle cx="45" cy="45" r="42" fill="#091540" stroke="#3DDC84" stroke-width="2.5" />
    <!-- Android Head -->
    <path d="M 28 46 C 28 35, 36 26, 45 26 C 54 26, 62 35, 62 46 Z" fill="#3DDC84" />
    <circle cx="35" cy="38" r="2.5" fill="#091540" />
    <circle cx="55" cy="38" r="2.5" fill="#091540" />
    <line x1="32" y1="26" x2="26" y2="18" stroke="#3DDC84" stroke-width="2.5" stroke-linecap="round" />
    <line x1="58" y1="26" x2="64" y2="18" stroke="#3DDC84" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Bottom Glassmorphic Identity Card -->
  <g transform="translate(150, 680)">
    <rect width="500" height="85" rx="20" fill="url(#cardGrad)" stroke="rgba(84, 197, 248, 0.4)" stroke-width="1.5" />
    <text x="250" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      Ahmed Hamdy
    </text>
    <text x="250" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#54C5F8" text-anchor="middle" letter-spacing="2">
      FLUTTER DEVELOPER • ANDROID
    </text>
  </g>
</svg>
